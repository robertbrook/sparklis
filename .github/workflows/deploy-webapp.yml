name: Deploy Webapp

on:
  push:
    branches:
      - master
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deployment context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Source directory: webapp"
          echo "Target environment: github-pages"

      - name: List files to deploy
        run: |
          set -euo pipefail
          echo "Webapp file count:"
          find webapp -type f | wc -l
          echo ""
          echo "Webapp size:"
          du -sh webapp
          echo ""
          echo "Webapp file list:"
          find webapp -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        if: ${{ always() }}
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"
